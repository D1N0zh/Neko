name: Build Neko APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'NekoProject.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Neko project
        run: unzip -o NekoProject.zip

      - name: Build signed APK
        run: gradle assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Neko.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neko-APK
          path: Neko.apk
          if-no-files-found: error
