name: Build Koin APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex-write-test
      - fix-manual-entry-and-import-review

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Recreate signing files
        shell: bash
        env:
          NEKO_KEYSTORE_BASE64: ${{ secrets.NEKO_KEYSTORE_BASE64 }}
          NEKO_STORE_PASSWORD: ${{ secrets.NEKO_STORE_PASSWORD }}
          NEKO_KEY_ALIAS: ${{ secrets.NEKO_KEY_ALIAS }}
          NEKO_KEY_PASSWORD: ${{ secrets.NEKO_KEY_PASSWORD }}
        run: |
          printf '%s' "$NEKO_KEYSTORE_BASE64" | base64 --decode > neko-release.jks
          {
            echo 'storeFile=neko-release.jks'
            printf 'storePassword=%s\n' "$NEKO_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$NEKO_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$NEKO_KEY_PASSWORD"
          } > keystore.properties

      - name: Build and check signed packages
        run: gradle assembleRelease bundleRelease lintRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Neko.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neko-APK
          path: Neko.apk
          if-no-files-found: error

      - name: Upload AAB for Google Play
        uses: actions/upload-artifact@v4
        with:
          name: Koin-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload Android checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Koin-Android-checks
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore
